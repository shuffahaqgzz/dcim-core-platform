global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files: [/etc/prometheus/rules.yml]
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: [prometheus:9090]}]
  - job_name: postgres-exporter
    static_configs: [{targets: [postgres-exporter:9187]}]
  - job_name: kafka-jmx-exporter
    static_configs: [{targets: [kafka-jmx-exporter:5556]}]
  - job_name: grafana
    metrics_path: /metrics
    static_configs: [{targets: [grafana:3000]}]
  - job_name: asset-repository
    metrics_path: /metrics
    static_configs: [{targets: [asset-repository:8000]}]
  - job_name: cmdb
    metrics_path: /metrics
    static_configs: [{targets: [cmdb:8000]}]
  - job_name: api
    metrics_path: /metrics
    static_configs: [{targets: [api:8000]}]
  - job_name: analytics
    metrics_path: /metrics
    static_configs: [{targets: [analytics:8000]}]
  - job_name: workflow
    metrics_path: /metrics
    static_configs: [{targets: [workflow:8000]}]
