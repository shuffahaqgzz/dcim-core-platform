title = "dcim-core-platform gitleaks configuration"

# Keep every upstream default rule; this file only narrows false positives.
[extend]
useDefault = true

# Pinned public supply-chain SHA-256 checksums are integrity material, not
# credentials. The default generic-api-key rule misreads the 64-hex value in
# `ARG KINOPENAPI_SHA256="..."` because the variable name contains "API".
# Allowlist the exact published tarball digest only; any new value requires an
# explicit, reviewable update here.
[allowlist]
description = "Exact pinned kin-openapi v0.144.0 tarball SHA-256 (public checksum)"
regexTarget = "secret"
regexes = [
  '''80395f1aefd21eea1d8a6664e70c03f08bd798b6014d84b2e8faa71adf4dfe2c''',
]
